name: Upload Secrets to Key Vault

on:
  workflow_call:
    inputs:
      vault-name:
        required: true
        type: string
      secrets-file:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  upload-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Loop through secrets file and upload
        run: |
          while IFS='|' read -r org repo secret_name secret_value; do
            [ -z "$org" ] && continue

            norm_org=$(echo "$org" | tr '[:upper:]_' '[:lower:]-')
            norm_repo=$(echo "$repo" | tr '[:upper:]_' '[:lower:]-')
            norm_secret=$(echo "$secret_name" | tr '[:upper:]_' '[:lower:]-')

            azure_secret_name="${norm_org}--${norm_repo}--${norm_secret}"
            echo "Uploading: $azure_secret_name"

            az keyvault secret set \
              --vault-name "${{ inputs.vault-name }}" \
              --name "$azure_secret_name" \
              --value "$secret_value" \
              --tags organization="$org" repository="$repo" original_secret="$secret_name"
          done < "${{ inputs.secrets-file }}"
